[package]
name = "bevy_shader"
version = "0.20.0"
edition = "2024"
description = "Provides shader asset types and import resolution for Bevy"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "shader"]

[dependencies]
# Released dependency identities keep this shader patch interoperable with Bevy 0.20.
bevy_asset = "0.20.0"
bevy_reflect = "0.20.0"
bevy_platform = "0.20.0"
bevy_utils = "0.20.0"

# other
wgpu-types = { version = "30", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = { version = "2", default-features = false }
wesl = { version = "0.6.0", features = ["naga-ext"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
bevy_app = "0.20.0"
bevy_tasks = "0.20.0"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
