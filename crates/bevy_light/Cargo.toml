[package]
name = "bevy_light"
version = "0.20.0"
edition = "2024"
description = "Keeps the lights on at Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[dependencies]
# Released dependency identities keep this patch interoperable with Bevy 0.20.
bevy_app = { version = "0.20.0" }
bevy_curve = { version = "0.20.0" }
bevy_asset = { version = "0.20.0" }
bevy_image = { version = "0.20.0" }
bevy_mesh = { version = "0.20.0" }
bevy_math = { version = "0.20.0" }
bevy_shape = { version = "0.20.0" }
bevy_reflect = { version = "0.20.0" }
bevy_camera = { version = "0.20.0" }
bevy_ecs = { version = "0.20.0" }
bevy_transform = { version = "0.20.0" }
bevy_utils = { version = "0.20.0" }
bevy_platform = { version = "0.20.0" }
bevy_color = { version = "0.20.0", features = [
  "serialize",
] }
bevy_gizmos = { version = "0.20.0", optional = true }
bevy_log = { version = "0.20.0" }

# other
tracing = { version = "0.1", default-features = false }
wgpu-types = { version = "30", default-features = false }
half = "2.7.1"
smallvec = { version = "1", default-features = false }

[features]
default = []
experimental_pbr_pcss = []
webgl = []
webgpu = []

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
