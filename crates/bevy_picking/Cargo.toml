[package]
name = "bevy_picking"
version = "0.20.0"
edition = "2024"
description = "Provides screen picking functionality for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"

[features]
# Provides a mesh picking backend
mesh_picking = ["dep:bevy_mesh", "dep:crossbeam-channel"]
custom_cursor = ["bevy_window/custom_cursor"]

[dependencies]
# Released package identities keep this patch interoperable with Bevy 0.20.
bevy_app = { version = "0.20.0" }
bevy_asset = { version = "0.20.0" }
bevy_derive = { version = "0.20.0" }
bevy_ecs = { version = "0.20.0" }
bevy_input = { version = "0.20.0" }
bevy_math = { version = "0.20.0" }
bevy_mesh = { version = "0.20.0", optional = true }
bevy_camera = { version = "0.20.0" }
bevy_reflect = { version = "0.20.0" }
bevy_shape = { version = "0.20.0" }
bevy_time = { version = "0.20.0" }
bevy_transform = { version = "0.20.0" }
bevy_window = { version = "0.20.0" }
bevy_platform = { version = "0.20.0", default-features = false, features = [
  "std",
] }

# other
crossbeam-channel = { version = "0.5", optional = true }
uuid = { version = "1.21.0", features = ["v4"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# TODO: Assuming all wasm builds are for the browser. Require `no_std` support to break assumption.
uuid = { version = "1.21.0", default-features = false, features = ["js"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options"]
all-features = true
